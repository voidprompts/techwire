name: Deploy to GitHub Pages

# This project deploys via Cloudflare Pages, whose Git integration builds
# directly on push — no workflow required. This GitHub Pages workflow is kept
# only as an escape hatch and is therefore MANUAL-ONLY.
#
# It used to run on every push to main. GitHub Pages is not enabled on this
# repository, so it failed at "Configure GitHub Pages" every single time and
# put a red X on each commit — noise that made a broken content pipeline much
# harder to spot.
#
# To switch back to GitHub Pages: enable Settings -> Pages -> Source:
# "GitHub Actions", then restore the `push:` trigger below.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let a newer commit supersede an in-flight build.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static export
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        env:
          # For a project site (user.github.io/repo) Pages provides the subpath here.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.origin }}${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
          NEXT_PUBLIC_BING_SITE_VERIFICATION: ${{ vars.NEXT_PUBLIC_BING_SITE_VERIFICATION }}
          NEXT_PUBLIC_TOPIC_INDEX_THRESHOLD: ${{ vars.NEXT_PUBLIC_TOPIC_INDEX_THRESHOLD }}
          NEXT_PUBLIC_ADSENSE_CLIENT: ${{ vars.NEXT_PUBLIC_ADSENSE_CLIENT }}
          NEXT_PUBLIC_ADSLOT_BELOW_TITLE: ${{ vars.NEXT_PUBLIC_ADSLOT_BELOW_TITLE }}
          NEXT_PUBLIC_ADSLOT_IN_ARTICLE: ${{ vars.NEXT_PUBLIC_ADSLOT_IN_ARTICLE }}
          NEXT_PUBLIC_ADSLOT_SIDEBAR: ${{ vars.NEXT_PUBLIC_ADSLOT_SIDEBAR }}
          NEXT_PUBLIC_ADSLOT_FOOTER: ${{ vars.NEXT_PUBLIC_ADSLOT_FOOTER }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
