name: Scrape and Publish

# Autopilot content pipeline.
# Runs every 5 hours, scrapes tech sources, rewrites them through the free AI
# tier, and commits any new markdown back to this branch. The commit then
# triggers the deploy workflow (or Cloudflare Pages' own Git integration).

on:
  schedule:
    # Every 5 hours, offset off the hour to avoid GitHub's peak-minute queueing.
    - cron: '17 */5 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max articles to publish this run'
        required: false
        default: '4'
      provider:
        description: 'AI provider (gemini or groq). Leave blank to auto-detect.'
        required: false
        default: ''
      dry_run:
        description: 'Collect and rank only — no AI calls, no commits'
        type: boolean
        required: false
        default: false

# Never let two scrape runs commit at the same time.
concurrency:
  group: scrape-and-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    name: Scrape, generate and commit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Check out the repository (the repo is our database).
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      # 2. Set up the Node.js environment.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify pipeline integrity
        run: node scripts/selftest.mjs

      # 3. Fail fast if no AI key actually reached the job.
      #    Secrets scoped to an *environment* are not exposed to a job that
      #    does not declare that environment, so the repo can look correctly
      #    configured while the scraper still runs keyless. Never print values.
      - name: Check AI credentials
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: |
          echo "GEMINI_API_KEY present: ${GEMINI_API_KEY:+yes}${GEMINI_API_KEY:-NO}"
          echo "GROQ_API_KEY present:   ${GROQ_API_KEY:+yes}${GROQ_API_KEY:-NO}"
          echo "UNSPLASH_ACCESS_KEY:    ${UNSPLASH_ACCESS_KEY:+yes}${UNSPLASH_ACCESS_KEY:-no (optional)}"
          if [ -z "$GEMINI_API_KEY" ] && [ -z "$GROQ_API_KEY" ]; then
            echo "::error::No AI key reached this job. Add GEMINI_API_KEY or GROQ_API_KEY as a *repository* secret (Settings -> Secrets and variables -> Actions -> Repository secrets). Environment-scoped secrets are not visible here."
            exit 1
          fi

      # 4. Run the scraper, injecting the AI key safely from GitHub Secrets.
      - name: Run scraper
        id: scrape
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          UNSPLASH_APP_NAME: ${{ vars.UNSPLASH_APP_NAME || 'techwire' }}
          AI_PROVIDER: ${{ github.event.inputs.provider }}
          MAX_POSTS_PER_RUN: ${{ github.event.inputs.limit || '4' }}
          LOG_LEVEL: info
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node scripts/scrape.mjs --dry-run
          else
            node scripts/scrape.mjs
          fi

      # 5. Check whether the scraper actually produced new ARTICLES.
      #    The bookkeeping file (content/.scraper-state.json) changes on every
      #    run even when nothing is published, so it must never by itself count
      #    as "new content" — otherwise the job commits an empty publish and
      #    reports success.
      - name: Detect new content
        id: changes
        run: |
          NEW_POSTS=$(git status --porcelain content/posts/ | grep -c '^??' || true)
          echo "new_posts=${NEW_POSTS}" >> "$GITHUB_OUTPUT"
          git status --short content/ public/images/thumbnails/ || true

          if [ "${NEW_POSTS}" -gt 0 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Detected ${NEW_POSTS} new article(s)."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new articles this run — state-only changes are not committed."
          fi

      # 6. Commit and push back to the branch.
      #    NOTE: do NOT put "[skip ci]" in this message. This workflow has no
      #    `push` trigger, so there is no self-trigger loop to prevent — but the
      #    marker DOES stop deploy.yml from running and is also honoured by
      #    Cloudflare Pages' Git integration, so it silently prevented every
      #    published article from ever reaching the live site.
      - name: Commit and push
        if: steps.changes.outputs.changed == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          git config user.name  "techwire-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/ public/images/thumbnails/
          git commit -m "chore: publish ${{ steps.changes.outputs.new_posts }} new article(s)"

          # Push with rebase-and-retry. The bookkeeping state file is rewritten
          # by every run, so concurrent runs reliably collide on it. Left alone
          # that conflict aborts the rebase and discards a run whose AI work is
          # already paid for — so resolve it as the set-union it actually is.
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi

            echo "Push rejected (attempt ${attempt}) — rebasing onto the new tip."
            if ! git pull --rebase --autostash origin "${GITHUB_REF_NAME}"; then
              CONFLICTS="$(git diff --name-only --diff-filter=U)"
              if [ -n "${CONFLICTS}" ]; then
                echo "Conflicted paths: ${CONFLICTS}"
                # Only the state file is safely auto-resolvable. Anything else
                # is a real conflict and must stop the run.
                if [ "${CONFLICTS}" = "content/.scraper-state.json" ]; then
                  node scripts/merge-state.mjs content/.scraper-state.json
                  git add content/.scraper-state.json
                  GIT_EDITOR=true git rebase --continue
                else
                  echo "::error::Unresolvable conflict in: ${CONFLICTS}"
                  git rebase --abort || true
                  exit 1
                fi
              else
                echo "::error::Rebase failed without conflicts."
                git rebase --abort || true
                exit 1
              fi
            fi
          done

          echo "::error::Could not push after 3 attempts."
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### TechWire autopilot run"
            echo ""
            if [ "${{ steps.changes.outputs.changed }}" = "true" ]; then
              echo "Published **${{ steps.changes.outputs.new_posts }}** new article(s)."
            elif [ "${{ steps.scrape.outcome }}" != "success" ]; then
              echo "⚠️ **The scraper failed — no articles were published.**"
              echo ""
              echo "Open the *Run scraper* step log for the provider error."
            else
              echo "No new articles — every candidate was a duplicate or failed quality checks."
            fi
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Candidates attempted | ${{ steps.scrape.outputs.attempted_count || '0' }} |"
            echo "| Articles published | ${{ steps.scrape.outputs.published_count || '0' }} |"
            echo "| Hard failures | ${{ steps.scrape.outputs.failure_count || '0' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
